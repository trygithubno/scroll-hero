<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome ItzFizz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #0c0d12;
      --bg-2: #171925;
      --ink: #f4f1ea;
      --muted: #9a9fb0;
      --road: #14151b;
      --green: #3fe08a;
      --orange: #ff8a1f;
      --cw: clamp(230px, 34vw, 520px);   /* car width, drives road height */
    }
    html, body { background: var(--bg-1); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
    .display { font-family: Unbounded, sans-serif; }

    /* Tall track = scroll distance; hero stays pinned while scrolling through it */
    #track { height: 400vh; position: relative; }
    #hero {
      position: sticky; top: 0; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      padding: 8vh 1rem 0;
      background:
        radial-gradient(900px 500px at 50% 0%, rgba(255,138,31,.14), transparent 70%),
        radial-gradient(800px 500px at 50% 100%, rgba(63,224,138,.10), transparent 70%),
        linear-gradient(180deg, var(--bg-2), var(--bg-1));
    }

    /* Headline */
    #headline { letter-spacing: 0; text-shadow: 0 0 40px rgba(255,138,31,.35); }

    /* Stats */
    .stat {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      backdrop-filter: blur(8px);
      will-change: transform, opacity;
    }
    .stat b { color: var(--green); }

    /* Road */
    #road {
      position: relative; width: 100%;
      height: calc(var(--cw) * 0.42);
      margin-top: auto; margin-bottom: 9vh;
    }
    #roadBg {
      position: absolute; inset: 0; overflow: hidden;
      background: var(--road);
      border-top: 2px solid #2a2c36; border-bottom: 2px solid #2a2c36;
      box-shadow: 0 0 60px rgba(0,0,0,.6) inset;
    }
    #dashes {
      position: absolute; top: 50%; left: 0; width: 220%; height: 4px; margin-top: -2px;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 50px, transparent 50px 110px);
      will-change: transform;
    }
    #trail {
      position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0);
      background: linear-gradient(90deg, rgba(63,224,138,.55), var(--green));
      box-shadow: 0 0 40px rgba(63,224,138,.6);
      will-change: transform;
    }
    #car {
      position: absolute; top: 50%; left: 0; width: var(--cw); height: auto;
      margin-top: calc(var(--cw) * -0.24);
      filter: drop-shadow(0 18px 18px rgba(0,0,0,.55));
      will-change: transform;
    }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main id="track">
    <section id="hero">

      <h1 id="headline" class="display text-center text-[clamp(.8rem,2.8vw,2.3rem)] font-light" aria-label="Welcome ItzFizz"></h1>

      <!-- Stats directly below headline -->
      <div class="mt-[5vh] grid w-full max-w-4xl grid-cols-2 gap-3 md:grid-cols-4 md:gap-5">
        <div class="stat text-center"><b class="display text-3xl md:text-5xl font-medium">58%</b><p class="mt-2 text-xs md:text-sm" style="color:var(--muted)">Increase in pick-up point use</p></div>
        <div class="stat text-center"><b class="display text-3xl md:text-5xl font-medium">23%</b><p class="mt-2 text-xs md:text-sm" style="color:var(--muted)">Decrease in customer phone calls</p></div>
        <div class="stat text-center"><b class="display text-3xl md:text-5xl font-medium">27%</b><p class="mt-2 text-xs md:text-sm" style="color:var(--muted)">Increase in repeat orders</p></div>
        <div class="stat text-center"><b class="display text-3xl md:text-5xl font-medium">40%</b><p class="mt-2 text-xs md:text-sm" style="color:var(--muted)">Decrease in delivery delays</p></div>
      </div>

      <!-- Road, trail, car -->
      <div id="road">
        <div id="roadBg">
          <div id="dashes"></div>
          <div id="trail"></div>
        </div>

        <!-- Top-down car facing right. To use a PNG: replace this <svg> with <img id="car" src="car.png" alt="Car" /> -->
        <svg id="car" viewBox="0 0 520 250" aria-label="Orange supercar" role="img">
          <defs>
            <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffa347"/><stop offset=".5" stop-color="#ff8a1f"/><stop offset="1" stop-color="#e86a00"/>
            </linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#1b1d24"/><stop offset="1" stop-color="#5b6070"/>
            </linearGradient>
          </defs>
          <!-- wheels -->
          <rect x="92"  y="4"   width="100" height="36" rx="13" fill="#0b0b0d"/>
          <rect x="92"  y="210" width="100" height="36" rx="13" fill="#0b0b0d"/>
          <rect x="345" y="6"   width="88"  height="32" rx="13" fill="#0b0b0d"/>
          <rect x="345" y="212" width="88"  height="32" rx="13" fill="#0b0b0d"/>
          <!-- body -->
          <path d="M10 125 C10 70 30 40 70 34 L330 26 C420 26 490 60 514 125 C490 190 420 224 330 224 L70 216 C30 210 10 180 10 125 Z" fill="url(#paint)"/>
          <!-- side intakes -->
          <path d="M200 40 L300 36 L290 50 L210 54 Z" fill="#c95800" opacity=".7"/>
          <path d="M200 210 L300 214 L290 200 L210 196 Z" fill="#c95800" opacity=".7"/>
          <!-- rear wing -->
          <path d="M6 58 Q-6 125 6 192 L40 184 Q28 125 40 66 Z" fill="#17181d"/>
          <!-- engine cover -->
          <path d="M60 100 L125 92 L125 158 L60 150 Q50 125 60 100 Z" fill="#1d1e24"/>
          <!-- cabin -->
          <path d="M125 80 L300 68 Q348 78 368 125 Q348 172 300 182 L125 170 Z" fill="url(#glass)"/>
          <path d="M292 76 Q338 86 355 125 Q338 164 292 174 Z" fill="#7b8194" opacity=".6"/>
          <!-- mirrors -->
          <path d="M300 22 L322 14 L326 26 L304 32 Z" fill="#e86a00"/>
          <path d="M300 228 L322 236 L326 224 L304 218 Z" fill="#e86a00"/>
          <!-- headlights -->
          <path d="M452 68 L488 88 L470 96 Z" fill="#fff4c2"/>
          <path d="M452 182 L488 162 L470 154 Z" fill="#fff4c2"/>
        </svg>
      </div>

    </section>
  </main>

  <section class="flex min-h-[60vh] items-center justify-center text-center" style="color:var(--muted)">
    <p class="display text-lg">Next section</p>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // ---------- Letter-spaced headline ----------
    const headline = document.getElementById("headline");
    headline.innerHTML = [..."WELCOME ITZ FIZZ"].map(ch =>
      ch === " "
        ? `<span class="inline-block w-[1.2em]"></span>`
        : `<span class="letter inline-block" style="margin:0 .28em">${ch}</span>`
    ).join("");

    // ---------- 1. Intro (time-based, runs once on load) ----------
    gsap.timeline({ defaults: { ease: "power3.out" } })
      .from(".letter", { y: 40, opacity: 0, duration: 0.9, stagger: 0.04 })
      .from(".stat",   { y: 30, opacity: 0, duration: 0.8, stagger: 0.2 }, "-=0.3")
      .from("#road",   { opacity: 0, y: 30, duration: 0.9 }, "-=0.9");

    // ---------- 2. Scroll-driven (progress-based) ----------
    const car = document.getElementById("car");
    const carW = () => car.getBoundingClientRect().width;
    const travel = () => window.innerWidth - carW();

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: "#track",
        start: "top top",
        end: "bottom bottom",
        scrub: 1,                  // eases the motion toward scroll position
        invalidateOnRefresh: true  // recalculates on resize only
      }
    });

    tl.fromTo(car, { x: 0 }, { x: () => travel(), ease: "none", duration: 1 }, 0)
      .fromTo("#trail", { scaleX: 0 },
              { scaleX: () => (travel() + carW() * 0.5) / window.innerWidth, ease: "none", duration: 1 }, 0)
      .to("#dashes", { x: () => -window.innerWidth * 0.6, ease: "none", duration: 1 }, 0)
      .to("#headline", { opacity: 0.45, y: -20, ease: "none", duration: 1 }, 0)
      .to(".stat", { y: -14, stagger: 0.05, ease: "none", duration: 1 }, 0);
  </script>
</body>
</html>
